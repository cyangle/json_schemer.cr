name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: "0 0 1 * *"

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Check format
        run: crystal tool format --check

  lint:
    name: Ameba Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        run: shards install

      - name: Run Ameba
        run: bin/ameba

  test:
    name: Tests (Crystal ${{ matrix.crystal }})
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.19", latest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --without-development

      - name: Run tests (default)
        run: crystal spec

      - name: Run tests (with simpleidn)
        run: crystal spec -Dwith_simpleidn
